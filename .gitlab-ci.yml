stages:
  - code_quality
  - test

default:
  image: python:3.12

pylint:
  stage: code_quality
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pylint main.py --fail-under=10

run-test:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml

calculate-coverage:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest -v test_main.py --cov=main --cov-report term-missing --cov-report xml:coverage.xml --cov-report html --cov-fail-under=90
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
