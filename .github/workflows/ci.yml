name: TP3 Continuous Integration

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  pylint:
    name: Code Quality - Pylint
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executer Pylint
        run: |
          pylint main.py --fail-under=10

  run-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: pylint
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests unitaires avec Pytest
        run: |
          pytest -v --junitxml=report.xml

      - name: Sauvegarder le rapport JUnit XML en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: report.xml
          if-no-files-found: ignore

  calculate-coverage:
    name: Calculate Code Coverage
    runs-on: ubuntu-latest
    needs: run-test
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calculer le code coverage (seuil > 90%)
        run: |
          pytest -v test_main.py --cov=main --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html --cov-fail-under=90

      - name: Sauvegarder les rapports de couverture en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
